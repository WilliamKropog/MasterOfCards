<header
  class="nav-bar"
  [class.nav-bar--searching]="matchmaking.searching()"
  role="banner"
>
  <div class="nav-bar-left">
    <div class="nav-bar-start">
      <button
        matButton="filled"
        type="button"
        class="nav-bar-start-btn"
        aria-label="Start local game"
        [disabled]="matchmaking.searching()"
        (click)="onStartLocalGame()"
      >
        Start Local Game
      </button>
      @if (matchmaking.searching()) {
        <button
          matButton="filled"
          type="button"
          class="nav-bar-start-btn"
          aria-label="Cancel live matchmaking"
          (click)="onCancelLiveSearch()"
        >
          Cancel
        </button>
      } @else {
        <button
          matButton="filled"
          type="button"
          class="nav-bar-start-btn"
          aria-label="Start live game"
          (click)="onStartLiveGame()"
        >
          Start Live Game
        </button>
      }
      <button
        matButton="filled"
        type="button"
        class="nav-bar-start-btn"
        aria-label="Add a Rock Booster Pack to inventory"
        [disabled]="!user() || pack.granting()"
        (click)="onGrantRockBoosterClick()"
      >
        {{ pack.granting() ? 'Adding…' : 'Add Rock Booster Pack' }}
      </button>
      <button
        matButton="filled"
        type="button"
        class="nav-bar-start-btn"
        aria-label="Add a Rock Starter Tin to inventory"
        [disabled]="!user() || pack.granting()"
        (click)="onGrantRockStarterTinClick()"
      >
        {{ pack.granting() ? 'Adding…' : 'Add Rock Starter Tin' }}
      </button>
      <ng-content select="[navStart]"></ng-content>
    </div>
    <nav class="nav-bar-links" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="nav-bar-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-bar-link"
      >Home</a>
      <a
        routerLink="/store"
        routerLinkActive="nav-bar-link--active"
        class="nav-bar-link"
      >Store</a>
      <a
        routerLink="/collection"
        routerLinkActive="nav-bar-link--active"
        class="nav-bar-link"
        [class.nav-bar-link--notify]="packInventory.hasUnseenPacks()"
        (click)="onCollectionNavClick()"
      >
        Collection
        @if (packInventory.hasUnseenPacks()) {
          <span class="nav-bar-link-dot" aria-hidden="true"></span>
        }
      </a>
      <a
        routerLink="/deck-builder"
        routerLinkActive="nav-bar-link--active"
        class="nav-bar-link"
      >Deck Builder</a>
    </nav>
  </div>
  <div class="nav-bar-right">
    @if (matchmaking.error()) {
      <p class="nav-bar-error" role="alert">{{ matchmaking.error() }}</p>
    }
    @if (pack.grantError(); as grantErr) {
      <p class="nav-bar-error" role="alert">{{ grantErr }}</p>
    }
    <ng-content select="[navEnd]"></ng-content>
  </div>
  @if (matchmaking.searching()) {
    <span class="nav-bar-search-bar" aria-hidden="true"></span>
  }
</header>
