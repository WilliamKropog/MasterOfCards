<div class="play-field">
  <app-field-row [playerSlot]="engine.topPlayerSlot()" zone="land" [isTopRow]="true" />
  <app-field-row [playerSlot]="engine.topPlayerSlot()" zone="monster" [isTopRow]="true" />
  <app-field-row [playerSlot]="engine.bottomPlayerSlot()" zone="monster" [isTopRow]="false" />
  <app-field-row [playerSlot]="engine.bottomPlayerSlot()" zone="land" [isTopRow]="false" />

  <div class="influence-overlay-grid" aria-hidden="true">
    @for (ov of landInfluenceOverlays(); track $index) {
      <div
        class="influence-outline"
        [style.grid-column]="ov.colStart + ' / ' + ov.colEnd"
        [style.grid-row]="ov.rowStart + ' / ' + ov.rowEnd"
      ></div>
    }
  </div>
</div>
