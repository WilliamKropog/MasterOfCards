<div class="home-shell">
  <app-nav-bar>
    <button
      navStart
      matButton="filled"
      type="button"
      class="home-start-btn"
      aria-label="Start game"
      (click)="onStartGame()"
    >
      Start Game
    </button>
  </app-nav-bar>

  <div class="home-body">
    <main class="home-main">
      <h1 class="home-title">Master of Cards</h1>
      <p class="home-subtitle">
        Press Start Game to enter a match. More modes and pages are on the way.
      </p>
    </main>
    <app-side-nav class="home-side-nav" />
  </div>
</div>
